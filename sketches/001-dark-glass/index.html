<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CF-Workers-SUB-Next · 模板 A · 暗色玻璃态</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0b14;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --text: #f4f4f6;
    --text-muted: #9ca3af;
    --accent: #7c5cff;
    --accent-glow: rgba(124,92,255,0.5);
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --radius: 16px;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(at 20% 10%, rgba(124,92,255,0.18), transparent 50%),
      radial-gradient(at 80% 90%, rgba(58,138,255,0.12), transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
  }
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; opacity: 0.3;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }
  .app {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; margin-bottom: 24px;
  }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #3a8aff);
    display: grid; place-items: center; font-weight: 700; font-size: 18px;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-version { font-size: 11px; color: var(--text-muted); }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: var(--text-muted); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all .15s;
    text-decoration: none;
  }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .nav-item.active {
    background: linear-gradient(90deg, var(--accent), transparent);
    color: var(--text);
    box-shadow: inset 3px 0 0 var(--accent), 0 0 16px var(--accent-glow);
  }
  .nav-icon { font-size: 18px; }
  .main { padding: 32px 40px; max-width: 1200px; }
  .page-header { margin-bottom: 32px; }
  .page-title {
    font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(180deg, var(--text), rgba(255,255,255,0.6));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .page-subtitle { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative; overflow: hidden;
    transition: transform .2s;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 28px; font-weight: 700; margin-top: 8px; letter-spacing: -0.02em; }
  .stat-meta { color: var(--success); font-size: 12px; margin-top: 4px; }
  .panel {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px; margin-bottom: 16px;
  }
  .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .node-list { display: flex; flex-direction: column; gap: 8px; }
  .node-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    transition: all .15s;
  }
  .node-row:hover { background: var(--surface-hover); border-color: var(--border); }
  .node-flag { font-size: 20px; }
  .node-name { flex: 1; font-size: 14px; font-weight: 500; }
  .node-status {
    padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 500;
  }
  .status-ok { background: rgba(52,211,153,0.15); color: var(--success); }
  .status-warn { background: rgba(251,191,36,0.15); color: var(--warning); }
  .btn {
    padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #3a8aff);
    border: none;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .btn-primary:hover { box-shadow: 0 6px 24px var(--accent-glow); transform: translateY(-1px); }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CF</div>
      <div>
        <div class="brand-name">CF-Workers-SUB</div>
        <div class="brand-version">v2.19.5</div>
      </div>
    </div>
    <a class="nav-item active"><span class="nav-icon">📊</span>仪表盘</a>
    <a class="nav-item"><span class="nav-icon">📥</span>订阅管理</a>
    <a class="nav-item"><span class="nav-icon">🔗</span>节点列表</a>
    <a class="nav-item"><span class="nav-icon">📋</span>分流规则</a>
    <a class="nav-item"><span class="nav-icon">⚙️</span>输出配置</a>
    <a class="nav-item"><span class="nav-icon">🔧</span>设置</a>
  </aside>
  <main class="main">
    <div class="page-header">
      <h1 class="page-title">仪表盘</h1>
      <p class="page-subtitle">实时统计 · 自动每日 07:00 北京时更新</p>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">总节点数</div>
        <div class="stat-value">128</div>
        <div class="stat-meta">+12 较昨日</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">活跃订阅</div>
        <div class="stat-value">3</div>
        <div class="stat-meta">全部正常</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已启用规则</div>
        <div class="stat-value">42</div>
        <div class="stat-meta">预设：完全体</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">CF 请求 (今日)</div>
        <div class="stat-value">8.4k</div>
        <div class="stat-meta">8.4% / 100k</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">
        <span>节点列表</span>
        <button class="btn btn-primary">⬇ 下载配置</button>
      </div>
      <div class="node-list">
        <div class="node-row"><span class="node-flag">🇯🇵</span><span class="node-name">JP-Tokyo-01</span><span class="node-status status-ok">在线</span></div>
        <div class="node-row"><span class="node-flag">🇺🇸</span><span class="node-name">US-LAX-03</span><span class="node-status status-ok">在线</span></div>
        <div class="node-row"><span class="node-flag">🇸🇬</span><span class="node-name">SG-PCCW-02</span><span class="node-status status-warn">测速中</span></div>
        <div class="node-row"><span class="node-flag">🇹🇼</span><span class="node-name">TW-Taipei-01</span><span class="node-status status-ok">在线</span></div>
      </div>
    </div>
  </main>
</div>
</body>
</html>

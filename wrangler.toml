name = "cf-workers-sub-next"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# KV 命名空间（本地 dev 用 preview KV，生产部署时 CI 从 GitHub Secrets 注入实际 id）
[[kv_namespaces]]
binding = "DATABASE"
id = "00000000-0000-0000-0000-000000000000"

# 无需敏感信息，全部通过 Cloudflare Secrets 配置
# ADMIN_PASSWORD, SESSION_SECRET 由 `wrangler secret put` 设置

# 规则目录同步：每月 1 号 03:00 UTC 自动扫描 MetaCubeX 仓库
# 订阅自动更新：每小时触发，scheduled handler 按设置页配置的小时(北京时间,默认07:00)判断是否执行
[triggers]
crons = ["0 3 1 * *", "0 * * * *"]
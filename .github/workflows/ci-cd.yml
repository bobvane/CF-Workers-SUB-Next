name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test

      # 注入 KV 命名空间 ID（必须早于 deploy）
      - name: Update wrangler.toml with KV namespace ID
        run: sed -i 's/id = "00000000-0000-0000-0000-000000000000"/id = "${{ secrets.KV_NAMESPACE_ID }}"/' wrangler.toml

      # 先部署 Worker（必须存在后才能设置 secret）
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 设置 Worker Secrets（可选，通过 env 传递避免 if 使用 secrets 上下文）
      - name: Set ADMIN_PASSWORD secret
        if: env.ADMIN_PASSWORD != '' && env.ADMIN_PASSWORD != 'none'
        run: printf '%s' "${ADMIN_PASSWORD}" | npx wrangler secret put ADMIN_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || '' }}

      - name: Set SESSION_SECRET secret
        if: env.SESSION_SECRET != '' && env.SESSION_SECRET != 'none'
        run: printf '%s' "${SESSION_SECRET}" | npx wrangler secret put SESSION_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || '' }}

      - name: Set GITHUB_TOKEN secret（规则目录同步用，可选）
        if: env.WORKER_GITHUB_TOKEN != '' && env.WORKER_GITHUB_TOKEN != 'none'
        run: printf '%s' "${WORKER_GITHUB_TOKEN}" | npx wrangler secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN || '' }}

      # 自动发布 GitHub Release：读 package.json 版本号，打 tag + 创建 Release
      # 版本号未变化的推送会跳过（tag 已存在）
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(grep '"version"' package.json | cut -d'"' -f4)"
          echo "检测到版本: ${VERSION}"
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q "${VERSION}"; then
            echo "标签 ${VERSION} 已存在，跳过 Release 发布"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes "自动发布：${VERSION}。变更见 [提交历史](https://github.com/${{ github.repository }}/commits/main)。" \
            --verify-tag
          echo "✅ 已发布 Release ${VERSION}"